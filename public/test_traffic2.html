<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #1e293b; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .traffic-container { position: relative; display: inline-block; }
    .traffic-img { height: 260px; width: auto; display: block; }
    .light-overlay { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 50%; pointer-events: none; }
    .red { top: 18%; width: 22%; height: 22%; background: rgba(239, 68, 68, 0.85); box-shadow: 0 0 25px #ef4444; }
    .yellow { top: 44%; width: 22%; height: 22%; background: rgba(245, 158, 11, 0.85); box-shadow: 0 0 25px #f59e0b; }
    .green { top: 70%; width: 22%; height: 22%; background: rgba(16, 185, 129, 0.85); box-shadow: 0 0 25px #10b981; }
  </style>
</head>
<body>
  <h2>Testing lumi_traffic_light.webp Overlay</h2>
  <div class="traffic-container">
    <img src="/lumi/special/traffic_light/lumi_traffic_light.webp" class="traffic-img" />
    <div class="light-overlay red"></div>
    <div class="light-overlay yellow"></div>
    <div class="light-overlay green"></div>
  </div>
</body>
</html>
