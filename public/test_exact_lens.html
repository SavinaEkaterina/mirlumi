<!DOCTYPE html>
<html>
<body>
<canvas id='c'></canvas>
<script>
const img = new Image();
img.src = '/lumi/special/lumi_traffic_light.webp';
img.onload = () => {
  const c = document.getElementById('c');
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, img.width, img.height).data;
  
  // Find green lens center in webp
  // Green lens has strong green component
  let greenY = [], greenX = [];
  let redY = [], redX = [];
  let yellowY = [], yellowX = [];
  
  for (let y = 0; y < img.height; y++) {
    for (let x = 0; x < img.width; x++) {
      const idx = (y * img.width + x) * 4;
      const r = data[idx], g = data[idx+1], b = data[idx+2], a = data[idx+3];
      if (a > 150) {
        // Red lens
        if (r > 180 && g < 60 && b < 60) { redY.push(y); redX.push(x); }
        // Yellow lens
        if (r > 200 && g > 150 && b < 60) { yellowY.push(y); yellowX.push(x); }
        // Green lens
        if (g > 150 && r < 100 && b < 100) { greenY.push(y); greenX.push(x); }
      }
    }
  }
  
  function avg(arr) { return arr.reduce((a,b)=>a+b,0)/arr.length; }
  console.log('Red Center X%:', (avg(redX)/img.width*100).toFixed(2), 'Y%:', (avg(redY)/img.height*100).toFixed(2));
  console.log('Yellow Center X%:', (avg(yellowX)/img.width*100).toFixed(2), 'Y%:', (avg(yellowY)/img.height*100).toFixed(2));
  console.log('Green Center X%:', (avg(greenX)/img.width*100).toFixed(2), 'Y%:', (avg(greenY)/img.height*100).toFixed(2));
  
  // Also let's measure diameter of green lens in %
  const minGY = Math.min(...greenY), maxGY = Math.max(...greenY);
  console.log('Green Lens Height %:', ((maxGY - minGY)/img.height*100).toFixed(2));
};
</script>
</body>
</html>
