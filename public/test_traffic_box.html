<!DOCTYPE html>
<html>
<body>
<canvas id='c'></canvas>
<script>
const img = new Image();
img.src = '/lumi/special/lumi_traffic_light.webp';
img.onload = () => {
  const c = document.getElementById('c');
  c.width = img.width;
  c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, img.width, img.height).data;
  let minX = img.width, maxX = 0, minY = img.height, maxY = 0;
  let count = 0;
  for (let y = 0; y < img.height; y++) {
    for (let x = 0; x < img.width; x++) {
      const alpha = data[(y * img.width + x) * 4 + 3];
      if (alpha > 10) {
        count++;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  console.log('Total non-transparent pixels:', count);
  console.log('Bounding Box X:', minX, 'to', maxX, 'Width:', maxX - minX);
  console.log('Bounding Box Y:', minY, 'to', maxY, 'Height:', maxY - minY);
  console.log('Center X%:', ((minX + maxX)/2 / img.width * 100).toFixed(1), 'Center Y%:', ((minY + maxY)/2 / img.height * 100).toFixed(1));
};
</script>
</body>
</html>
