<!DOCTYPE html>
<html>
<head>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<script src='https://cdn.tailwindcss.com'></script>
<style>
  body { background-color: #f0f4f8; color: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; gap: 30px; }
  .traffic-container { position: relative; display: inline-flex; align-items: center; justify-content: center; }
  .traffic-img { height: 360px; width: auto; object-fit: contain; }
  
  .lamp-spot {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    width: 8.5%;
    aspect-ratio: 1;
  }

  .lamp-red { top: 22.5%; left: 48.2%; }
  .lamp-yellow { top: 39.5%; left: 48.2%; }
  .lamp-green { top: 56.5%; left: 48.2%; }

  .glow-red {
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(239,68,68,1) 50%, rgba(239,68,68,0.85) 80%, rgba(239,68,68,0) 100%);
    box-shadow: 0 0 8px rgba(239,68,68,0.9);
  }
  
  .glow-yellow {
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(245,158,11,1) 50%, rgba(245,158,11,0.85) 80%, rgba(245,158,11,0) 100%);
    box-shadow: 0 0 8px rgba(245,158,11,0.9);
  }

  .glow-green {
    background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(16,185,129,1) 50%, rgba(16,185,129,0.85) 80%, rgba(16,185,129,0) 100%);
    box-shadow: 0 0 8px rgba(16,185,129,0.9);
  }
</style>
</head>
<body>
<div class='flex gap-12 flex-wrap justify-center'>
  <div class='flex flex-col items-center gap-2'>
    <h3 class='text-red-600 font-bold text-lg'>КРАСНЫЙ (Red Active)</h3>
    <div class='traffic-container'>
      <img src='/lumi/special/lumi_traffic_light.webp' class='traffic-img' />
      <div class='lamp-spot lamp-red glow-red'></div>
    </div>
  </div>

  <div class='flex flex-col items-center gap-2'>
    <h3 class='text-amber-600 font-bold text-lg'>ЖЁЛТЫЙ (Yellow Active)</h3>
    <div class='traffic-container'>
      <img src='/lumi/special/lumi_traffic_light.webp' class='traffic-img' />
      <div class='lamp-spot lamp-yellow glow-yellow'></div>
    </div>
  </div>

  <div class='flex flex-col items-center gap-2'>
    <h3 class='text-emerald-600 font-bold text-lg'>ЗЕЛЁНЫЙ (Green Active)</h3>
    <div class='traffic-container'>
      <img src='/lumi/special/lumi_traffic_light.webp' class='traffic-img' />
      <div class='lamp-spot lamp-green glow-green'></div>
    </div>
  </div>
</div>
</body>
</html>
