<!DOCTYPE html>
<html>
<head>
<style>
body { background: #0f172a; color: white; display: flex; gap: 20px; padding: 20px; align-items: center; justify-content: center; }
.card { display: flex; flex-direction: column; align-items: center; }
img { height: 320px; width: auto; object-fit: contain; }
.glow-red { filter: drop-shadow(0 -40px 30px rgba(239, 68, 68, 0.9)); }
.glow-yellow { filter: drop-shadow(0 0px 30px rgba(245, 158, 11, 0.9)); }
.glow-green { filter: drop-shadow(0 40px 30px rgba(16, 185, 129, 0.9)); }
</style>
</head>
<body>
<div class='card'><h3>Raw 3D Asset</h3><img src='/lumi/special/lumi_traffic_light.webp' /></div>
<div class='card'><h3>Red Active</h3><img src='/lumi/special/lumi_traffic_light.webp' class='glow-red' /></div>
<div class='card'><h3>Yellow Active</h3><img src='/lumi/special/lumi_traffic_light.webp' class='glow-yellow' /></div>
<div class='card'><h3>Green Active</h3><img src='/lumi/special/lumi_traffic_light.webp' class='glow-green' /></div>
</body>
</html>
