<!DOCTYPE html>
<html>
<head>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<script src='https://cdn.tailwindcss.com'></script>
<style>
  body { background-color: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
  .glow-red { filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.9)); }
  .glow-yellow { filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.9)); }
  .glow-green { filter: drop-shadow(0 0 25px rgba(16, 185, 129, 0.9)); }
</style>
</head>
<body>
<div class='flex gap-8 items-center justify-center flex-wrap'>
  <div class='flex flex-col items-center gap-2'>
    <span class='text-red-400 font-bold'>КРАСНЫЙ</span>
    <div class='relative flex items-center justify-center'>
      <img src='/lumi/special/lumi_traffic_light.webp' class='h-72 w-auto object-contain glow-red' />
    </div>
  </div>

  <div class='flex flex-col items-center gap-2'>
    <span class='text-amber-400 font-bold'>ЖЁЛТЫЙ</span>
    <div class='relative flex items-center justify-center'>
      <img src='/lumi/special/lumi_traffic_light.webp' class='h-72 w-auto object-contain glow-yellow' />
    </div>
  </div>

  <div class='flex flex-col items-center gap-2'>
    <span class='text-emerald-400 font-bold'>ЗЕЛЁНЫЙ</span>
    <div class='relative flex items-center justify-center'>
      <img src='/lumi/special/lumi_traffic_light.webp' class='h-72 w-auto object-contain glow-green' />
    </div>
  </div>
</div>
</body>
</html>
